<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ user.username }}'s Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'contest/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'contest/index.css' %}">
    <link rel="stylesheet" href="{% static 'contest/footer.css' %}">
</head>

<body class="bg-gray-100 dark:bg-gray-900">
    {% csrf_token %}

    <div class="mainContainer">
        {% include 'contest/navbar.html' %}

        <div class="max-w-3xl mx-auto mt-10 p-6 bg-white border border-gray-200 rounded-lg shadow-lg dark:bg-gray-800 dark:border-gray-700">
            <div class="flex items-center space-x-6">
                <!-- <img src="{% static 'contest/default_profile.png' %}" alt="Profile Picture"
                    class="w-24 h-24 rounded-full border-4 border-blue-500 dark:border-blue-400">
                 -->
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Name: {{ user.username }}</h1>
                    <p class="text-gray-600 dark:text-gray-300">ID: #{{ user.id }}</p>
                </div>
            </div>

            <div class="mt-6 grid grid-cols-2 gap-4">
                <!-- Coins -->
                <div class="p-4 bg-blue-50 border border-blue-200 rounded-lg text-center dark:bg-blue-900 dark:border-blue-700">
                    <h2 class="text-xl font-bold text-blue-600 dark:text-blue-400">Coins</h2>
                    <p class="text-2xl font-semibold">{{ user.coins }}<span>
                        <img class="coinIcon navCoinIcon"
                           src="https://img.icons8.com/?size=100&id=iRgwumOATYL6&format=png&color=000000"
                           alt="coin icon" srcset=""></span></p>
                </div>

                <!-- Stats Placeholder -->
                <div class="p-4 bg-green-50 border border-green-200 rounded-lg text-center dark:bg-green-900 dark:border-green-700">
                    <h2 class="text-xl font-bold text-green-600 dark:text-green-400">Contests Participated</h2>
                    <p class="text-2xl font-semibold">{{submissions.count}}</p>
                </div>
            </div>

            <!-- Edit Profile Button -->
            <div class="mt-6 text-center">
                <a href="#" 
                   class="px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 dark:bg-blue-500 dark:hover:bg-blue-600 dark:focus:ring-blue-800">
                    ✏️ Edit Profile
                </a>
            </div>
        </div>

    </div>

    {% include 'contest/footer.html' %}
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>

</html>
